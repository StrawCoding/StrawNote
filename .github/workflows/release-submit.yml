name: Submit Release Candidate
on:
  workflow_run:
    workflows: [Release Candidates]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  submit:
    # StrawNote keeps candidate artifacts on StrawCoding/StrawNote.
    # Upstream AFFiNE native submission is disabled for this fork.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Skipped for StrawNote
        run: echo "StrawNote pre-releases are published from StrawCoding/StrawNote; affine-native submit is disabled."
