# StrawNote — Play production (SMB-style)
# Trigger: push tag v*.0 (e.g. v0.28.0). Non-*.0 → play-internal-release.
name: play-production-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'VERSION_NAME without v prefix; must end with .0 (e.g. 0.28.0)'
        required: true
        type: string
      version_code:
        description: 'Android versionCode integer (empty = derive from VERSION_NAME)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play-production-release:
    if: >-
      ${{
        (github.event_name == 'push' && endsWith(github.ref_name, '.0')) ||
        (github.event_name == 'workflow_dispatch' && endsWith(inputs.version_name, '.0'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      JAVA_VERSION: '21'
      RUBY_VERSION: '3.3'
      ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_PRODUCTION_TRACK: production
      PLAY_RELEASE_STATUS: completed
      AFFINE_ANDROID_CARGO_PROFILE: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          extra-flags: workspaces focus @strawnote/monorepo @affine-tools/cli @affine/android
          electron-install: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - name: Install Fastlane
        run: gem install fastlane -v 2.238.0 --no-document

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;27.0.12077973" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > packages/frontend/apps/android/App/local.properties

      - name: Setup Rust (android target)
        uses: ./.github/actions/build-rust
        with:
          target: 'aarch64-linux-android'
          package: 'affine_mobile_native'
          no-build: 'true'

      - name: Require keystore secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare release paths
        run: |
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release-keystore.jks" >> "$GITHUB_ENV"
          echo "PLAY_JSON_KEY_PATH=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          test -s "$ANDROID_KEYSTORE_FILE"

      - name: Compute version
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            echo "::error::VERSION_NAME required"
            exit 1
          fi
          case "$VERSION_NAME" in
            *.0) ;;
            *)
              echo "::error::Production requires VERSION_NAME ending in .0 (got ${VERSION_NAME})"
              exit 1
              ;;
          esac
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

          INPUT_CODE="${{ inputs.version_code }}"
          if [ -n "$INPUT_CODE" ]; then
            VERSION_CODE="$INPUT_CODE"
          else
            MAJOR="${VERSION_NAME%%.*}"
            REST="${VERSION_NAME#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            PATCH="${PATCH%%.*}"
            MAJOR="${MAJOR:-0}"
            MINOR="${MINOR:-0}"
            PATCH="${PATCH:-0}"
            VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          fi
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Resolved VERSION_NAME=${VERSION_NAME} VERSION_CODE=${VERSION_CODE}"

      - name: Build Android web assets
        run: yarn affine @affine/android build
        env:
          PUBLIC_PATH: /

      - name: Cap sync
        run: yarn workspace @affine/android cap sync

      - name: Write Firebase config for release build
        run: |
          cat > packages/frontend/apps/android/App/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1",
              "project_id": "strawnote-ci",
              "storage_bucket": "strawnote-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.strawcoding.strawnote"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci-placeholder" }],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build signed canaryRelease AAB
        working-directory: packages/frontend/apps/android/App
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleCanaryRelease --no-daemon --stacktrace

      - name: Resolve AAB path
        run: |
          RESOLVED_AAB_PATH="$(find packages/frontend/apps/android/App/app/build/outputs/bundle -type f -name '*.aab' | sort | tail -n 1)"
          if [ -z "$RESOLVED_AAB_PATH" ]; then
            echo "Unable to find AAB" >&2
            find packages/frontend/apps/android/App/app/build/outputs -maxdepth 6 -type f | sort >&2 || true
            exit 1
          fi
          echo "AAB_PATH=$RESOLVED_AAB_PATH" >> "$GITHUB_ENV"
          RESOLVED_MAPPING_PATH="$(find packages/frontend/apps/android/App/app/build/outputs/mapping -type f -name 'mapping.txt' | sort | tail -n 1 || true)"
          if [ -n "$RESOLVED_MAPPING_PATH" ]; then
            echo "PLAY_MAPPING_PATH=$RESOLVED_MAPPING_PATH" >> "$GITHUB_ENV"
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: strawnote-play-production-aab-${{ github.ref_name }}
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            ${{ env.AAB_PATH }}
            ${{ env.PLAY_MAPPING_PATH }}

      - name: Restore Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set"
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_JSON_KEY_PATH"
          test -s "$PLAY_JSON_KEY_PATH"

      - name: Publish to Google Play production
        working-directory: packages/frontend/apps/android
        run: fastlane android production
        env:
          ANDROID_PACKAGE_NAME: ${{ secrets.ANDROID_PACKAGE_NAME || 'com.strawcoding.strawnote' }}
